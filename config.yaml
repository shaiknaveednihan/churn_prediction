# Configuration for the Lab 6-9 MLOps pipeline
data:
  raw_path: data/raw/churn.csv
  processed_dir: data/processed
  target_column: Churn
  id_column: customerID

split:
  test_size: 0.2
  random_state: 42

model:
  n_estimators: 200
  max_depth: 15
  random_state: 42
  class_weight: balanced

mlflow:
  experiment_name: Telco_Churn_Prediction
  tracking_uri: sqlite:///mlflow.db

registry:
  model_name: Telco_Churn_Production_Model
  decision_metric: f1_score

quality_gate:
  metric: f1_score
  minimum_value: 0.50

paths:
  model: models/random_forest_model.pkl
  preprocessor: models/preprocessor.pkl
  evaluation_report: reports/model_evaluation.json
  quality_gate_report: reports/quality_gate.json
  inference_output: outputs/churn_predictions.csv
  failure_report: reports/lab9_failure_report.json

lab9:
  repetitions: 2
